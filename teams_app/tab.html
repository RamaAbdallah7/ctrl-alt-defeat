<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarteeb &mdash; Project health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://res.cdn.office.net/teams-js/2.24.0/js/MicrosoftTeams.min.js"
        integrity="sha384-hK9Yn9cLSbaULIPPQqjB0vURcq35W1lJnb3xJqZWLBLCiHYWFOPfJRxKMSOzxvSF"
        crossorigin="anonymous"></script>
<style>
:root{
  --paper:#f3ece0; --surface:#fffdf8; --surface-2:#faf4e8; --surface-3:#eee3d0;
  --ink:#2b1e10; --ink-2:#5c4830; --ink-3:#8a7359;
  --line:#e2d6c0; --line-2:#c9b696;
  --accent:#7a4f1c; --accent-soft:#f4e7c9; --accent-ink:#5a3a14;
  --gold:#c8901f; --gold-soft:#fbefd2;
  --critical:#9e2b25; --critical-soft:#f7e0da;
  --warn:#b8801a; --warn-soft:#fbeed0;
  --good:#4f6b2a; --good-soft:#e7eed6;
  --chrome:#2b1e10; --chrome-ink:#eadfcb; --chrome-line:#4a3722;
  --shadow:0 1px 2px rgba(43,30,16,.07),0 4px 14px rgba(43,30,16,.06);
  --f-disp:"IBM Plex Sans Condensed",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16100a; --surface:#211810; --surface-2:#2b2016; --surface-3:#37291c;
  --ink:#f2e8d8; --ink-2:#c6b296; --ink-3:#937c60;
  --line:#3b2c1d; --line-2:#513d28;
  --accent:#d9a95c; --accent-soft:#3d2c14; --accent-ink:#f0d6a6;
  --gold:#e8bb5a; --gold-soft:#40300f;
  --critical:#e8837b; --critical-soft:#3f1d17;
  --warn:#e0aa48; --warn-soft:#3a2a12;
  --good:#a3c072; --good-soft:#25301a;
  --chrome:#120c06; --chrome-ink:#ded0b8; --chrome-line:#2e2114;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --paper:#16100a; --surface:#211810; --surface-2:#2b2016; --surface-3:#37291c;
  --ink:#f2e8d8; --ink-2:#c6b296; --ink-3:#937c60;
  --line:#3b2c1d; --line-2:#513d28;
  --accent:#d9a95c; --accent-soft:#3d2c14; --accent-ink:#f0d6a6;
  --gold:#e8bb5a; --gold-soft:#40300f;
  --critical:#e8837b; --critical-soft:#3f1d17;
  --warn:#e0aa48; --warn-soft:#3a2a12;
  --good:#a3c072; --good-soft:#25301a;
  --chrome:#120c06; --chrome-ink:#ded0b8; --chrome-line:#2e2114;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;
  line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============================= SIGN IN ============================= */
.signin{min-height:100vh;display:grid;place-items:center;padding:28px 18px;
  background:radial-gradient(ellipse at 50% 0%,var(--surface-3),var(--paper) 62%)}
.card{width:100%;max-width:430px;background:var(--surface);border:1px solid var(--line);
  border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.card .top{padding:22px 24px 16px;border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.mark .glyph{width:26px;height:26px;border-radius:4px;background:var(--gold);color:#2b1e10;
  display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px}
.mark .wm{font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:-.01em}
.card h1{font-family:var(--f-disp);font-size:22px;font-weight:600;margin:0 0 5px;letter-spacing:-.01em}
.card .sub{color:var(--ink-2);font-size:13.5px;margin:0}
.card .list{padding:8px}
.who{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;
  padding:10px 12px;border:1px solid transparent;border-radius:4px;background:none;
  cursor:pointer;text-align:left;color:inherit}
.who:hover{background:var(--surface-2);border-color:var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:12px;font-weight:600;color:#fff}
.who .nm{font-weight:600;font-size:14px}
.who .rl{font-size:12px;color:var(--ink-3)}
.who .go{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.who:hover .go{color:var(--accent)}
.card .foot{padding:12px 16px;background:var(--surface-2);border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-3);line-height:1.5}

/* ============================= APP SHELL ============================= */
.app{display:none;min-height:100vh;flex-direction:column}
.app.on{display:flex}
.chrome{background:var(--chrome);color:var(--chrome-ink);display:flex;align-items:center;
  justify-content:space-between;gap:14px;padding:0 14px;height:46px;flex:none}
.chrome .l,.chrome .r{display:flex;align-items:center;gap:10px;min-width:0}
.chrome .wm{font-family:var(--f-disp);font-weight:700;font-size:15px;color:#fff}
.chrome .ws{font-family:var(--f-mono);font-size:11px;color:#8fa4b6;
  border-left:1px solid var(--chrome-line);padding-left:10px;white-space:nowrap}
.userchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);
  border:1px solid var(--chrome-line);border-radius:20px;padding:3px 10px 3px 3px}
.userchip .av{width:24px;height:24px;font-size:10px}
.userchip .nm{font-size:12.5px;font-weight:500}
.verified{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;color:#7fd6a8;
  text-transform:uppercase}
.chrome button{background:none;border:1px solid var(--chrome-line);color:#8fa4b6;
  font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  border-radius:3px;padding:5px 9px;cursor:pointer}
.chrome button:hover{color:#fff;border-color:#4d6478}

.main{flex:1;display:grid;grid-template-columns:224px minmax(0,1fr) 286px;min-height:0}
@media (max-width:1180px){.main{grid-template-columns:200px minmax(0,1fr)}
  .rightrail{display:none}}
@media (max-width:820px){.main{grid-template-columns:1fr}.sidebar{display:none}}

.sidebar{background:var(--surface-2);border-right:1px solid var(--line);padding:12px 0;
  overflow-y:auto}
.sect{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding:9px 14px 5px}
.chan{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:6px 14px;font-size:13.5px;color:var(--ink-2);font-family:var(--f-mono)}
.chan:hover{background:var(--surface-3);color:var(--ink)}
.chan[aria-current="true"]{background:var(--accent);color:#fff;font-weight:500}

.agentrow{display:grid;grid-template-columns:8px 1fr;gap:8px;padding:5px 14px;align-items:center}
.agentrow .d{width:7px;height:7px;border-radius:50%;background:var(--line-2);
  transition:background .3s,box-shadow .3s,transform .3s}
.agentrow.woke .d{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);transform:scale(1.15)}
.agentrow.done .d{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.agentrow .n{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.agentrow.woke .n,.agentrow.done .n{color:var(--ink)}

/* ============================= CONVERSATION ============================= */
.thread{padding:16px 20px 30px;overflow-y:auto;min-width:0}
.chanhead{display:flex;align-items:baseline;gap:10px;padding-bottom:11px;
  border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.chanhead h2{font-family:var(--f-disp);font-size:17px;margin:0;font-weight:600}
.chanhead .m{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}

.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;margin-bottom:16px}
.msg .av{width:32px;height:32px;font-size:11px}
.msg .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;flex-wrap:wrap}
.msg .who2{font-weight:600;font-size:13.5px}
.msg .ts{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.msg .bot{font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--accent-soft);color:var(--accent-ink);padding:1px 5px;border-radius:2px}
.msg .txt{font-size:14px;color:var(--ink)}

/* the run, as steps */
.run{border:1px solid var(--line);border-radius:5px;background:var(--surface);overflow:hidden;
  box-shadow:var(--shadow)}
.runhd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px;
  background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.runhd .t{font-family:var(--f-disp);font-weight:600;font-size:13px}
.runhd .el{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.steps{padding:4px 0}
.step{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;
  padding:7px 13px;opacity:.36;transition:opacity .3s}
.step.on,.step.ok{opacity:1}
.step .ic{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);margin-top:2px;
  display:grid;place-items:center;font-family:var(--f-mono);font-size:9px;color:var(--ink-3);
  transition:border-color .3s,background .3s,color .3s}
.step.on .ic{border-color:var(--accent);color:var(--accent)}
.step.ok .ic{border-color:var(--good);background:var(--good);color:#fff}
.step .lb{font-size:13px;font-weight:500}
.step .de{font-size:12px;color:var(--ink-2);margin-top:1px}
.step .ms{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px}
.step.on .lb{color:var(--accent)}
.spin{display:inline-block;width:9px;height:9px;border:1.5px solid var(--accent);
  border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.enginechips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.ec{font-family:var(--f-mono);font-size:10.5px;padding:2px 7px;border-radius:2px;
  border:1px solid var(--line-2);color:var(--ink-3)}
.ec.ran{border-color:var(--good);color:var(--good);background:var(--good-soft)}

/* brief + findings */
.brief{border:1px solid var(--line);border-radius:5px;background:var(--surface);
  box-shadow:var(--shadow);overflow:hidden;margin-top:11px}
.brief .bh{padding:10px 13px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brief .bh .t{font-family:var(--f-disp);font-weight:600;font-size:15px}
.brief .bh .m{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;
  background:var(--line);border-bottom:1px solid var(--line)}
.tile{background:var(--surface);padding:9px 12px}
.tile .k{font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3)}
.tile .v{font-family:var(--f-mono);font-size:18px;font-weight:500;margin-top:1px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .v.bad{color:var(--critical)}.tile .v.good{color:var(--good)}.tile .v.warn{color:var(--warn)}
.tile .n{font-size:10.5px;color:var(--ink-3)}
.finding{display:grid;grid-template-columns:3px minmax(0,1fr);gap:11px;padding:11px 13px;
  border-bottom:1px solid var(--line)}
.finding .st{background:var(--accent);border-radius:2px}
.finding.warn .st{background:var(--warn)}.finding.bad .st{background:var(--critical)}
.finding.good .st{background:var(--good)}
.fh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.fn{font-family:var(--f-disp);font-weight:600;font-size:14px}
.fr{font-family:var(--f-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-3)}
.ft{font-size:13px;color:var(--ink-2)}
.ft b{color:var(--ink);font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.bsec{padding:10px 13px;border-bottom:1px solid var(--line)}
.bsec .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:3px}
.bsec.risk .k{color:var(--critical)}
.bsec p{margin:0;font-size:13px;color:var(--ink-2)}
.bsec.risk p{color:var(--ink)}

/* decision */
.decide{padding:12px 13px;background:var(--surface-2);display:flex;gap:8px;flex-wrap:wrap;
  align-items:center}
.btn{font-size:13px;font-weight:500;border-radius:3px;padding:7px 14px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.no{border-color:var(--critical);color:var(--critical)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.decide .as{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-left:auto}

/* receipt */
.receipt{border:1px solid var(--good);border-radius:5px;background:var(--good-soft);
  padding:12px 13px;margin-top:11px}
.receipt .rh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.receipt .rt{font-family:var(--f-disp);font-weight:600;font-size:14px;color:var(--good)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-family:var(--f-mono);
  font-size:11.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink);word-break:break-all}
.hash{color:var(--accent)}

/* right rail: audit ledger */
.rightrail{background:var(--surface-2);border-left:1px solid var(--line);display:flex;
  flex-direction:column;min-height:0}
.rrh{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;gap:8px}
.rrh .t{font-family:var(--f-disp);font-size:11.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}
.chainstate{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;background:var(--good-soft);color:var(--good)}
.chainstate.broken{background:var(--critical-soft);color:var(--critical)}
.ledger{flex:1;overflow-y:auto;padding:8px 0;min-height:120px}
.entry{padding:7px 13px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:11px}
.entry .e1{display:flex;justify-content:space-between;gap:8px}
.entry .ev{color:var(--accent)}
.entry.tampered .ev{color:var(--critical)}
.entry .tm{color:var(--ink-3);font-size:10px}
.entry .dt{color:var(--ink-2);margin-top:2px;word-break:break-word}
.entry .hs{color:var(--ink-3);font-size:9.5px;margin-top:2px;word-break:break-all}
.entry.tampered{background:var(--critical-soft)}
.rrf{padding:10px 13px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.rrf button{flex:1;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.05em;padding:6px 8px;border-radius:3px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.rrf button:hover{border-color:var(--accent);color:var(--accent)}
.rrf .danger:hover{border-color:var(--critical);color:var(--critical)}
.verdict{padding:0 13px 10px;font-family:var(--f-mono);font-size:11px;line-height:1.5}
.verdict.ok{color:var(--good)}.verdict.bad{color:var(--critical)}

/* composer */
.composer{border-top:1px solid var(--line);background:var(--surface);padding:11px 20px;flex:none}
.prompts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.p{font-size:12.5px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;
  padding:5px 11px;cursor:pointer;color:var(--ink-2)}
.p:hover{border-color:var(--accent);color:var(--accent)}
.p[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.cbox{display:flex;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:4px;
  padding:7px 9px;background:var(--surface-2)}
.cbox .at{font-family:var(--f-mono);font-size:12px;color:var(--accent);white-space:nowrap}
.cbox input{flex:1;border:0;background:none;font-family:var(--f-body);font-size:13.5px;
  color:var(--ink);min-width:0}
.cbox input:focus{outline:none}
.cbox button{background:var(--accent);color:#fff;border:0;border-radius:3px;padding:6px 13px;
  font-size:13px;font-weight:500;cursor:pointer}
.cbox button:disabled{opacity:.45;cursor:not-allowed}
.netwrap{overflow-x:auto;padding:4px 13px 12px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:11.5px;
  font-variant-numeric:tabular-nums}
th{text-align:right;font-weight:500;font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.crit td{background:var(--critical-soft);color:var(--ink)}
tr.crit td:first-child{font-weight:600;color:var(--critical)}
.legend{display:flex;gap:13px;flex-wrap:wrap;padding:0 13px 9px;font-family:var(--f-mono);
  font-size:10px;color:var(--ink-3)}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:4px}
.secnote{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);padding:0 13px 10px;line-height:1.5}
/* ============================= DASHBOARD ============================= */
.dash{padding:16px 20px 30px;overflow-y:auto;min-width:0}
.dashhd{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding-bottom:11px;border-bottom:1px solid var(--line);margin-bottom:16px}
.dashhd h2{font-family:var(--f-disp);font-size:19px;margin:0 0 2px;font-weight:600}
.dashhd .m{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.rag{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:3px;font-weight:600}
.rag.red{background:var(--critical-soft);color:var(--critical)}
.rag.amber{background:var(--warn-soft);color:var(--warn)}
.rag.green{background:var(--good-soft);color:var(--good)}
.rag .bulb{width:8px;height:8px;border-radius:50%;background:currentColor}

.verdictbar{border:1px solid var(--line);border-left:4px solid var(--critical);border-radius:5px;
  background:var(--surface);padding:13px 15px;margin-bottom:16px;box-shadow:var(--shadow)}
.verdictbar.amber{border-left-color:var(--warn)}
.verdictbar.green{border-left-color:var(--good)}
.verdictbar .h{font-family:var(--f-disp);font-size:16px;font-weight:600;margin-bottom:3px}
.verdictbar p{margin:0;font-size:13.5px;color:var(--ink-2)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px;
  margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:12px 13px;
  box-shadow:var(--shadow);border-top:3px solid var(--line-2)}
.kpi.red{border-top-color:var(--critical)}
.kpi.amber{border-top-color:var(--warn)}
.kpi.green{border-top-color:var(--good)}
.kpi .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;

<body>
<div class="tabbar"><span class="w">Tarteeb</span><span class="ctx" id="ctx">project health</span></div>
<div class="dash" id="dash"></div>
<script>
const $=id=>document.getElementById(id);
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
const num=n=>(+n).toLocaleString(undefined,{maximumFractionDigits:2});
/* ============================ ENGINES ============================ */
/* Ports of engines/*.py. No LLM touches a number on this page. */

function cpm(tasks){
  const T={}; tasks.forEach(t=>T[t.id]={...t,preds:t.predecessors||[],succ:[]});
  Object.values(T).forEach(t=>t.preds.forEach(p=>T[p]&&T[p].succ.push(t.id)));
  const indeg={},order=[];Object.keys(T).forEach(k=>indeg[k]=T[k].preds.length);
  let q=Object.keys(indeg).filter(k=>!indeg[k]).sort();
  while(q.length){q.sort();const n=q.shift();order.push(n);
    T[n].succ.forEach(m=>{if(--indeg[m]===0)q.push(m)})}
  order.forEach(id=>{const t=T[id];
    t.es=t.preds.length?Math.max(...t.preds.map(p=>T[p].ef)):0; t.ef=t.es+t.duration});
  const dur=Math.max(...Object.values(T).map(t=>t.ef));
  [...order].reverse().forEach(id=>{const t=T[id];
    t.lf=t.succ.length?Math.min(...t.succ.map(s=>T[s].ls)):dur; t.ls=t.lf-t.duration});
  Object.values(T).forEach(t=>{t.tf=+(t.ls-t.es).toFixed(6);
    t.ff=+((t.succ.length?Math.min(...t.succ.map(s=>T[s].es)):dur)-t.ef).toFixed(6);
    t.crit=Math.abs(t.tf)<1e-9});
  const crit=new Set(order.filter(id=>T[id].crit));
  const starts=[...crit].filter(id=>!T[id].preds.some(p=>crit.has(p))).sort();
  const paths=[]; const stack=starts.map(s=>[s]);
  while(stack.length){const pth=stack.pop();
    const nx=T[pth[pth.length-1]].succ.filter(s=>crit.has(s)).sort();
    if(!nx.length)paths.push(pth); else nx.forEach(n=>stack.push(pth.concat(n)))}
  paths.sort();
  return{duration:dur,path:paths[0]||[],paths,parallel:paths.length>1,
    tasks:order.map(id=>T[id]),map:T};
}
function scoring(criteria,options){
  const tw=criteria.reduce((a,c)=>a+c.weight,0), warn=[];
  if(Math.abs(tw-100)>0.01)warn.push(`Criterion weights total ${tw}, not 100 \u2014 scores are normalised.`);
  const ranked=options.map(o=>({option:o.name,
    score:+criteria.reduce((a,c)=>a+(o.scores[c.name]||0)*(c.weight/tw),0).toFixed(2)}))
    .sort((a,b)=>b.score-a.score);
  return{ranked,warnings:warn};
}
function evm(pv,ev,ac,bac,plannedDuration){
  const cpi=ac?ev/ac:null, spi=pv?ev/pv:null, eac=cpi?bac/cpi:null;
  return{pv,ev,ac,bac,cv:ev-ac,sv:ev-pv,cpi,spi,eac,etc:eac!==null?eac-ac:null,
    vac:eac!==null?bac-eac:null,
    tcpiBac:(bac-ac)!==0?(bac-ev)/(bac-ac):null,
    estDuration:(plannedDuration&&spi)?plannedDuration/spi:null,
    plannedDuration:plannedDuration||null, pct:+(ev/bac*100).toFixed(2)};
}
function finance(costs,benefits,rate,startYear){
  startYear=startYear||0; const n=Math.max(costs.length,benefits.length);
  let cc=0,cb=0,pay=null,rows=[];
  for(let t=0;t<n;t++){
    const f=1/Math.pow(1+rate,t+startYear), c=(costs[t]||0)*f, b=(benefits[t]||0)*f;
    const prev=cb-cc; cc+=c; cb+=b; const gap=cb-cc;
    if(pay===null&&gap>=0) pay=(t===0||prev===gap)?t+startYear:(t+startYear-1)+(-prev/(gap-prev));
    rows.push({year:t+startYear,factor:f,dc:c,db:b,cum:gap});
  }
  const tdc=rows.reduce((a,r)=>a+r.dc,0), tdb=rows.reduce((a,r)=>a+r.db,0);
  return{rows,totalCost:tdc,totalBenefit:tdb,npv:tdb-tdc,roi:tdc?(tdb-tdc)/tdc:null,payback:pay,rate};
}
function pert(acts,target,unit){
  let e=0,v=0; const rows=acts.map(a=>{
    const ex=(a.optimistic+4*a.most_likely+a.pessimistic)/6, sd=(a.pessimistic-a.optimistic)/6;
    e+=ex; v+=sd*sd; return{...a,expected:ex,sd:sd}});
  const psd=Math.sqrt(v);
  const phi=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),
    p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p};
  return{rows,expected:e,sd:psd,unit:unit||'days',target:target??null,
    r95:[e-2*psd,e+2*psd], prob:target!=null?(psd?phi((target-e)/psd):(target>=e?1:0)):null};
}
function crash(tasks,target){
  const work=tasks.map(t=>({...t})), byId={}; work.forEach(t=>byId[t.id]=t);
  const cr={}; work.forEach(t=>{if(t.crash_duration!=null){
    const room=t.duration-t.crash_duration;
    if(room>0)cr[t.id]={cd:t.crash_duration,per:(t.crash_cost-t.normal_cost)/room}}});
  const base=cpm(work), baseDur=base.duration; let cost=0,steps=[],guard=0;
  while(guard++<400){
    const cur=cpm(work); if(target!=null&&cur.duration<=target)break;
    const cand=cur.tasks.filter(t=>t.crit&&cr[t.id]&&byId[t.id].duration>cr[t.id].cd).map(t=>t.id);
    if(!cand.length)break;
    const eff=cand.filter(id=>{byId[id].duration--;const d=cpm(work).duration;byId[id].duration++;
      return d<cur.duration});
    let chosen;
    if(eff.length) chosen=[eff.reduce((a,b)=>cr[a].per<=cr[b].per?a:b)];
    else{ chosen=[cand.reduce((a,b)=>cr[a].per<=cr[b].per?a:b)] }
    chosen.forEach(id=>byId[id].duration--);
    const nd=cpm(work).duration;
    if(nd>=cur.duration){ chosen.forEach(id=>byId[id].duration++);
      steps.push({stopped:'Remaining critical path has no crashable activity \u2014 further spend buys no time. Not charged.'});break}
    cost+=chosen.reduce((a,id)=>a+cr[id].per,0);
    steps.push({ids:chosen,from:cur.duration,to:nd,cum:cost});
  }
  const fin=cpm(work);
  return{baseDur,baseline:base.path,finalDur:fin.duration,finalPath:fin.path,
    finalPaths:fin.paths,finalParallel:fin.parallel,
    saved:baseDur-fin.duration,cost,per:(baseDur-fin.duration)?cost/(baseDur-fin.duration):null,steps,
    reached:target==null||fin.duration<=target,target};
}
function fastTrack(tasks,frac){
  frac=frac||0.5; const r=cpm(tasks), out=[];
  r.tasks.filter(t=>t.crit).forEach(t=>t.preds.forEach(p=>{
    if(r.map[p]&&r.map[p].crit) out.push({pred:r.map[p].name,succ:t.name,
      save:+(Math.min(r.map[p].duration,t.duration)*frac).toFixed(2)})}));
  out.sort((a,b)=>b.save-a.save); return{candidates:out,path:r.path,duration:r.duration};
}
function wbs(items){
  const N={}; items.forEach(i=>N[i.id]={...i,children:[]});
  const orph=[]; Object.values(N).forEach(n=>{if(n.parent){N[n.parent]?N[n.parent].children.push(n.id):orph.push(n)}});
  const roll={},f=id=>{if(roll[id]!=null)return roll[id];const n=N[id];
    roll[id]=n.children.length?n.children.reduce((a,c)=>a+f(c),0):(n.value||0);return roll[id]};
  const roots=Object.values(N).filter(n=>!n.parent||!N[n.parent]).map(n=>n.id); roots.forEach(f);
  const viol=[]; Object.values(N).forEach(n=>{ if(!n.children.length||n.value==null)return;
    const ct=n.children.reduce((a,c)=>a+roll[c],0);
    if(Math.abs(ct-n.value)>Math.max(.01,Math.abs(n.value)*.01))
      viol.push({name:n.name,stated:n.value,children:ct,diff:ct-n.value})});
  const leaves=Object.values(N).filter(n=>!n.children.length);
  return{count:items.length,packages:leaves,rollup:roll,
    total:roots.reduce((a,r)=>a+roll[r],0),violations:viol,orphans:orph};
}
function scopeCreep(baseline,current){
  const B={},C={}; baseline.forEach(r=>B[r.id]=r); current.forEach(r=>C[r.id]=r);
  const added=current.filter(r=>!B[r.id]), removed=baseline.filter(r=>!C[r.id]);
  const changed=current.filter(r=>B[r.id]&&B[r.id].value!=null&&r.value!=null&&B[r.id].value!==r.value)
    .map(r=>({name:r.name,from:B[r.id].value,to:r.value}));
  const bt=baseline.reduce((a,r)=>a+(r.value||0),0), ct=current.reduce((a,r)=>a+(r.value||0),0);
  return{added,removed,changed,baselineTotal:bt,currentTotal:ct,growth:ct-bt,
    pct:bt?(ct-bt)/bt*100:null};
}
const EST_TYPES={rom:[-.5,1,'Very early, often 3\u20135 years out or before the project is officially started'],
  budgetary:[-.1,.25,'Early, 1\u20132 years out'],definitive:[-.05,.1,'Later, less than a year out']};
function estimateBand(est,type,budget){
  const [lo,hi,when]=EST_TYPES[type];
  const L=est*(1+lo),H=est*(1+hi);
  return{est,type,lo,hi,low:L,high:H,when,budget:budget??null,
    within:budget!=null?(budget>=L&&budget<=H):null};
}

/* ============================ ROSTER ============================ */
const ROSTER=[
  {k:'schedule',   n:'Critical Path Analyst',      r:'Schedule',    m:'When the project actually finishes, and which tasks drive that date.'},
  {k:'crashing',   n:'Schedule Recovery Analyst',  r:'Compression', m:'The cheapest way to buy back time when the date has to move in.'},
  {k:'fast_track', n:'Fast-Track Analyst',         r:'Compression', m:'Which sequential work could overlap when there is no budget to crash.'},
  {k:'cost',       n:'Earned Value Analyst',       r:'Cost control',m:'Cost and schedule performance against baseline, and where it lands.'},
  {k:'financial',  n:'Business Case Analyst',      r:'Investment',  m:'Whether the project is worth doing at all \u2014 NPV, ROI, payback.'},
  {k:'pert',       n:'Estimation Analyst',         r:'Estimating',  m:'Uncertain estimates into an expected figure, a spread, and odds.'},
  {k:'estimate',   n:'Estimate Assurance Analyst', r:'Estimating',  m:'Holds an estimate to the accuracy its type actually supports.'},
  {k:'wbs',        n:'Scope Architect',            r:'Scope',       m:'Whether the breakdown holds together and accounts for all the work.'},
  {k:'scope_creep',n:'Baseline Guardian',          r:'Scope',       m:'What changed against the approved baseline without a change request.'},
  {k:'scoring',    n:'Options Analyst',            r:'Decision',    m:'The weighted decision matrix \u2014 and when a winner is really a tie.'},
];
const BY=Object.fromEntries(ROSTER.map(a=>[a.k,a]));

/* ============================ PROJECT X DATA ============================ */
/* Figure 6-2 network: duration 16 days, critical path B-E-H-J, task F holds 7 days of float. */
const TASKS=[
 {id:'A',name:'Requirements sign-off',duration:1,predecessors:[]},
 {id:'B',name:'System design',duration:2,predecessors:[],crash_duration:1,normal_cost:1000,crash_cost:1800},
 {id:'C',name:'Vendor selection',duration:3,predecessors:[]},
 {id:'D',name:'Data migration',duration:4,predecessors:['A']},
 {id:'E',name:'Backend build',duration:5,predecessors:['B'],crash_duration:3,normal_cost:2000,crash_cost:2600},
 {id:'F',name:'Documentation',duration:4,predecessors:['B']},
 {id:'G',name:'Hardware install',duration:6,predecessors:['C']},
 {id:'H',name:'Integration testing',duration:6,predecessors:['D','E'],crash_duration:4,normal_cost:3000,crash_cost:5000},
 {id:'I',name:'Staff training',duration:2,predecessors:['G']},
 {id:'J',name:'Go-live',duration:3,predecessors:['F','H','I'],crash_duration:2,normal_cost:500,crash_cost:1400},
];
const WBS_BASE=[
 {id:'1',name:'Registration system',value:120000},
 {id:'1.1',name:'Analysis',parent:'1',value:30000},
 {id:'1.2',name:'Build',parent:'1',value:60000},
 {id:'1.3',name:'Testing',parent:'1',value:30000},
];
const WBS_NOW=[...WBS_BASE.map(r=>({...r})),
 {id:'1.4',name:'Mobile companion app',parent:'1',value:26000},
 {id:'1.5',name:'Single sign-on',parent:'1',value:9000}];

/* ============================ SCENARIOS ============================ */
const SCEN=[
 {id:'sched',label:'When does Project X finish?',
  ask:'When does Project X actually finish, and where is the slack?',
  src:'/pm in #project-x',wake:['schedule'],
  run(){const r=cpm(TASKS);return{schedule:r}}},

 {id:'recover',label:'Can we hit day 13?',
  ask:'The steering committee wants Project X live by day 13. Can we do it, and what does it cost?',
  src:'@Tarteeb in #project-x',wake:['schedule','crashing','fast_track'],
  run(){return{schedule:cpm(TASKS),crashing:crash(TASKS,13),fast_track:fastTrack(TASKS,.5)}}},

 {id:'vendor',label:'Which vendor do we pick?',
  ask:'We need to choose between four vendors on cost, quality, delivery, support and risk.',
  src:'/pm in #project-x',wake:['scoring'],
  run(){return{scoring:scoring(
    [{name:'Cost',weight:30},{name:'Quality',weight:20},{name:'Delivery',weight:30},
     {name:'Support',weight:10},{name:'Risk',weight:10}],
    [{name:'Option #1',scores:{Cost:100,Quality:90,Delivery:40,Support:70,Risk:50}},
     {name:'Option #2',scores:{Cost:100,Quality:100,Delivery:20,Support:10,Risk:10}},
     {name:'Option #3',scores:{Cost:80,Quality:95,Delivery:10,Support:20,Risk:20}},
     {name:'Option #4',scores:{Cost:10,Quality:95,Delivery:100,Support:100,Risk:100}}])}}},

 {id:'budget',label:'How are we tracking on budget?',
  ask:'Six months in on a twelve-month plan \u2014 how is Project X tracking on cost and schedule?',
  src:'/pm in #project-x',wake:['cost'],
  run(){return{cost:evm(42000,35000,41000,120000,12)}}},

 {id:'worth',label:'Is this worth doing?',
  ask:'Before we commit: is Project X worth doing at an 8% discount rate?',
  src:'@Tarteeb in #steering',wake:['financial','estimate'],
  run(){return{financial:finance([120000,25000,25000,25000,25000],[0,90000,110000,120000,130000],.08,0),
    estimate:estimateBand(120000,'budgetary',110000)}}},

 {id:'confidence',label:'How firm is the estimate?',
  ask:'The build estimate keeps moving. How confident are we in finishing the remaining work in 20 days?',
  src:'/pm in #project-x',wake:['pert'],
  run(){return{pert:pert([
    {id:'E',name:'Backend build',optimistic:4,most_likely:5,pessimistic:12},
    {id:'H',name:'Integration testing',optimistic:4,most_likely:6,pessimistic:14},
    {id:'J',name:'Go-live',optimistic:2,most_likely:3,pessimistic:6}],20,'days')}}},

 {id:'scope',label:'Has the scope grown?',
  ask:'Two new asks landed this sprint. Has Project X grown since the board approved it?',
  src:'CSV dropped in #project-x',wake:['wbs','scope_creep'],
  run(){return{wbs:wbs(WBS_NOW),scope_creep:scopeCreep(WBS_BASE,WBS_NOW)}}},

 {id:'all',label:'Full steering review',
  ask:'Full review before the steering committee: schedule, cost, scope and the vendor decision.',
  src:'/pm in #steering',wake:['schedule','crashing','cost','scoring','wbs','scope_creep'],
  run(){return{schedule:cpm(TASKS),crashing:crash(TASKS,13),cost:evm(42000,35000,41000,120000,12),
    scoring:SCEN.find(s=>s.id==='vendor').run().scoring,wbs:wbs(WBS_NOW),
    scope_creep:scopeCreep(WBS_BASE,WBS_NOW)}}},
];


/* ============================ DASHBOARD ============================ */
function health(){
  const sch=cpm(TASKS), cost=evm(42000,35000,41000,120000,12);
  const cr=crash(TASKS,13), sc=scopeCreep(WBS_BASE,WBS_NOW), wb=wbs(WBS_NOW);
  const fin=finance([120000,25000,25000,25000,25000],[0,90000,110000,120000,130000],.08,0);
  const floatDays=sch.tasks.filter(t=>!t.crit).reduce((a,t)=>a+t.tf,0);
  const k=[];
  const rag=(v,g,a)=>v>=g?'green':v>=a?'amber':'red';
  k.push({k:'Schedule performance',tag:'SPI',v:cost.spi.toFixed(2),
    n:`Forecast ${cost.estDuration.toFixed(1)} months against ${cost.plannedDuration} planned.`,
    s:rag(cost.spi,1,.9),pct:Math.min(cost.spi,1.3)/1.3});
  k.push({k:'Cost performance',tag:'CPI',v:cost.cpi.toFixed(2),
    n:`${money(cost.eac)} forecast against a ${money(cost.bac)} budget.`,
    s:rag(cost.cpi,1,.9),pct:Math.min(cost.cpi,1.3)/1.3});
  k.push({k:'Budget variance',tag:'VAC',v:money(cost.vac),
    n:`${cost.pct.toFixed(0)}% of the work is complete.`,
    s:cost.vac>=0?'green':'red',pct:Math.min(Math.abs(cost.vac)/cost.bac*3,1)});
  k.push({k:'Critical path',tag:`${sch.duration}d`,v:sch.path.join('-'),
    n:`${floatDays} days of float exist off the critical path.`,
    s:floatDays>10?'green':floatDays>4?'amber':'red',pct:Math.min(floatDays/20,1)});
  k.push({k:'Scope vs baseline',tag:sc.added.length+' added',
    v:(sc.pct>0?'+':'')+sc.pct.toFixed(1)+'%',
    n:`${money(sc.growth)} entered scope after approval.`,
    s:sc.pct<=0?'green':sc.pct<5?'amber':'red',pct:Math.min(Math.abs(sc.pct)/25,1)});
  k.push({k:'Business case',tag:'NPV',v:money(fin.npv),
    n:`ROI ${(fin.roi*100).toFixed(0)}%, payback year ${fin.payback.toFixed(1)}.`,
    s:fin.npv>0?'green':'red',pct:Math.min(Math.max(fin.npv,0)/200000,1)});

  const reds=k.filter(x=>x.s==='red').length, ambers=k.filter(x=>x.s==='amber').length;
  const overall=reds>=2?'red':reds===1||ambers>=2?'amber':'green';

  const risks=[];
  if(cost.cpi<1&&cost.spi<1)risks.push({s:'red',t:'Over budget and behind schedule at once',
    o:'Earned Value Analyst',d:`CPI ${cost.cpi.toFixed(2)} and SPI ${cost.spi.toFixed(2)}. Remaining work must run at a TCPI of ${cost.tcpiBac.toFixed(2)} to still land on budget, well above anything achieved so far.`});
  if(!cr.reached)risks.push({s:'red',t:`The day-${cr.target} target cannot be bought`,
    o:'Schedule Recovery Analyst',d:`${money(cr.cost)} of crashing reaches day ${cr.finalDur}, not ${cr.target}. Beyond that it needs scope cut or fast tracking, not money.`});
  if(sc.added.length)risks.push({s:'amber',t:`${sc.added.length} items entered scope after approval`,
    o:'Baseline Guardian',d:`${sc.added.map(a=>a.name).join(', ')} \u2014 ${money(sc.growth)}, ${sc.pct.toFixed(1)}% growth. Each needs an approved change request or it is scope creep.`});
  if(wb.violations.length)risks.push({s:'amber',t:'The work breakdown does not add up',
    o:'Scope Architect',d:`${wb.violations[0].name} states ${money(wb.violations[0].stated)} but its children total ${money(wb.violations[0].children)}.`});
  if(fin.npv>0)risks.push({s:'green',t:'The business case still holds',
    o:'Business Case Analyst',d:`NPV ${money(fin.npv)} at ${(fin.rate*100).toFixed(0)}%. The pressure here is delivery, not justification.`});

  return {k,overall,risks,sch,cost,cr,sc,fin};
}

function varianceChart(cost){
  const W=430,H=136,P={l:46,r:10,t:10,b:22};
  const series=[{n:'PV',v:cost.pv,c:'var(--ink-3)'},{n:'EV',v:cost.ev,c:'var(--accent)'},
    {n:'AC',v:cost.ac,c:'var(--critical)'}];
  const max=Math.max(...series.map(s=>s.v))*1.15;
  const iw=W-P.l-P.r, bh=(H-P.t-P.b)/3-8;
  let g='';
  [0,.5,1].forEach(f=>{const x=P.l+iw*f;
    g+=`<line x1="${x}" y1="${P.t}" x2="${x}" y2="${H-P.b}" stroke="var(--line)" stroke-width="1"/>
        <text x="${x}" y="${H-P.b+13}" font-family="var(--f-mono)" font-size="8.5" fill="var(--ink-3)"
          text-anchor="middle">${money(max*f)}</text>`});
  series.forEach((s,i)=>{const y=P.t+i*((H-P.t-P.b)/3), w=Math.max(iw*(s.v/max),1);
    g+=`<text x="${P.l-7}" y="${y+bh/2+3}" font-family="var(--f-mono)" font-size="10"
          fill="var(--ink-2)" text-anchor="end">${s.n}</text>
        <rect x="${P.l}" y="${y}" width="${w}" height="${bh}" rx="2" fill="${s.c}"/>
        <text x="${P.l+w+6}" y="${y+bh/2+3.5}" font-family="var(--f-mono)" font-size="9.5"
          fill="var(--ink-2)">${money(s.v)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img"
    aria-label="Planned value, earned value and actual cost compared">${g}</svg>`;
}

function renderDash(){
  const h=health();
  const label={red:'At risk',amber:'Needs attention',green:'On track'}[h.overall];
  const verdict={
    red:'Project X is over budget and behind schedule at the same time, and the date the committee asked for cannot be bought back with money. A decision is needed on scope or on the date.',
    amber:'Project X is holding, but more than one indicator has moved the wrong way since baseline. Worth a look before the next steering meeting.',
    green:'Project X is tracking to plan on every indicator the specialists measure.'}[h.overall];

  $('dash').innerHTML=`
    <div class="dashhd">
      <div><h2>Project X &mdash; health</h2>
        <div class="m">Registration system replacement &middot; recomputed live from every specialist engine</div></div>
      <span class="rag ${h.overall}"><span class="bulb"></span>${label}</span>
    </div>

    <div class="verdictbar ${h.overall}">
      <div class="h">${label}</div><p>${verdict}</p>
    </div>

    <div class="kpis">${h.k.map(x=>`
      <div class="kpi ${x.s}">
        <div class="k"><span>${x.k}</span><span class="tag">${x.tag}</span></div>
        <div class="v">${x.v}</div>
        <div class="n">${x.n}</div>
        <div class="bar"><i style="width:${Math.round(x.pct*100)}%"></i></div>
      </div>`).join('')}</div>

    <div class="panels">
      <div class="dpanel">
        <h3>Where the money stands</h3>
        <div class="chartwrap">${varianceChart(h.cost)}</div>
        <div class="secnote">Earned value is below both the plan and what has been spent &mdash;
          the gap between EV and AC is the ${money(Math.abs(h.cost.cv))} cost variance.</div>
      </div>

      <div class="dpanel">
        <h3>Critical path &middot; ${h.sch.duration} days</h3>
        <div class="pathstrip">${h.sch.tasks.filter(t=>t.crit).map((t,i,arr)=>
          `<div class="node crit"><div class="id">${t.id}</div>
            <div class="nm2">${t.name}</div><div class="fl">${t.duration}d</div></div>
           ${i<arr.length-1?'<div class="arrowgap crit">&rarr;</div>':''}`).join('')}</div>
        <div class="secnote">Zero float on every one of these. The most flexible task off the path holds
          ${Math.max(...h.sch.tasks.filter(t=>!t.crit).map(t=>t.tf))} days.</div>
      </div>

      <div class="dpanel" style="grid-column:1/-1">
        <h3>Open risks &mdash; raised by the specialists, not by hand</h3>
        ${h.risks.map(r=>`<div class="risk ${r.s}"><div class="s"></div>
          <div><div class="t">${r.t}</div><div class="d">${r.d}</div></div>
          <div class="o">${r.o}</div></div>`).join('')}
      </div>
    </div>`;
}


renderDash();

/* Teams hands the tab its theme and who is looking at it. Outside Teams the
   page still renders -- it just falls back to the OS colour scheme. */
(function(){
  if(!(window.microsoftTeams&&microsoftTeams.app))return;
  microsoftTeams.app.initialize().then(async()=>{
    const ctx=await microsoftTeams.app.getContext();
    const who=ctx.user&&(ctx.user.displayName||ctx.user.userPrincipalName);
    if(who)$('ctx').textContent=who+' \u00b7 project health';
    const applyTheme=t=>{
      document.documentElement.setAttribute('data-theme',
        (t==='dark'||t==='contrast')?'dark':'light');
      renderDash();
    };
    applyTheme(ctx.app&&ctx.app.theme);
    microsoftTeams.app.registerOnThemeChangeHandler(applyTheme);
  }).catch(()=>{});
})();
</script>
